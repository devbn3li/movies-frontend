name: Deploy Frontend to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 74.234.195.22
          username: azureuser
          key: ${{ secrets.VMKEY }}
          script: |
            set -e
            cd movies-frontend
            
            # Remove generated files that might conflict
            rm -f public/sitemap*.xml public/robots.txt
            
            # Reset any local changes and pull latest
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Build the project (this will regenerate sitemap and robots.txt)
            npm run build
            
            # Restart the application
            pm2 delete movies-frontend || true
            pm2 start npm --name "movies-frontend" -- run start
            pm2 save
            
            # Verify deployment
            echo "Deployment completed successfully"
            pm2 status movies-frontend